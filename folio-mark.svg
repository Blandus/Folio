<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Folio icon (ab v83): three fanned sheets (Sage, Mist, white) on Folio Blue, one handwritten stroke. Original artwork.
       Rounded corners are part of the file, so the icon is never shown as a sharp square (Windows taskbar, favicon). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4C80B3"/>
      <stop offset="1" stop-color="#335F8C"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#0F2747" flood-opacity=".3"/>
    </filter>
    <clipPath id="round"><rect width="1024" height="1024" rx="229"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <g transform="translate(512 512) scale(1.08) translate(-512 -520)">
      <rect x="312" y="260" width="400" height="520" rx="52" fill="#9FC0B0" transform="translate(-74 14) rotate(-19 512 520)"/>
      <rect x="312" y="260" width="400" height="520" rx="52" fill="#BCD6F2" transform="translate(-34 4) rotate(-8 512 520)"/>
      <g transform="translate(40 0) rotate(7 512 520)" filter="url(#lift)">
        <path d="M364 260H588L712 384V728a52 52 0 0 1-52 52H364a52 52 0 0 1-52-52V312a52 52 0 0 1 52-52Z" fill="url(#paper)"/>
        <path d="M588 260V340a44 44 0 0 0 44 44H712Z" fill="#CFDDEB"/>
        <path d="M372 574C408 470 470 456 486 516C502 580 450 630 488 614C528 598 540 492 582 506C616 518 592 586 648 546" stroke="#3E6E9F" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
    </g>
  </g>
</svg>
